name: Feature request
description: Propose a change or an addition
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that cryer does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A route, an ingest adapter, a setting, an MCP tool, a CLI flag…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Notifications / embeds
        - Prompts and answers (buttons, reactions, replies)
        - Callbacks
        - Ingest adapters
        - MCP server
        - CLI
        - Store / replicas
        - Docker / deployment
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues.
