# Typecheck, unit tests and a boot + /health probe (bin/verify) on every push and pull request.
name: run-tests
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message }} · ${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same Bun as the image base (Dockerfile: oven/bun:1.4.3-slim).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bin/verify
