# Development: the checkout bind-mounted into a plain Bun image, restarted on every change.
#   docker compose -f compose.dev.yaml run --rm cryer bun install
#   docker compose -f compose.dev.yaml up
# Bun reads ./.env from the mount. A private CA goes in a compose.override.yaml, see compose.override.yaml.example.
services:
  cryer:
    image: oven/bun:1.4.3-slim
    container_name: cryer-dev
    working_dir: /app
    command: bun --watch src/index.ts
    ports:
      - "127.0.0.1:7474:7474"
    volumes:
      - type: bind
        source: .
        target: /app
        bind:
          create_host_path: false
      - node_modules:/app/node_modules
    restart: unless-stopped
    mem_limit: 256m

volumes:
  node_modules:
